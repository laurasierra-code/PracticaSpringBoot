<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del comercial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h1 class="h3 text-primary" th:text="${comercial.nombre + ' ' + comercial.apellido1}">Comercial</h1>
                    <dl class="row mt-4">
                        <dt class="col-sm-5">ID</dt><dd class="col-sm-7" th:text="${comercial.id}">1</dd>
                        <dt class="col-sm-5">Segundo apellido</dt><dd class="col-sm-7" th:text="${comercial.apellido2 ?: '-'}">-</dd>
                        <dt class="col-sm-5">Comisión</dt><dd class="col-sm-7" th:text="${comercial.comision ?: '-'}">-</dd>
                    </dl>
                    <a class="btn btn-outline-secondary" href="/comerciales">Volver</a>
                    <a class="btn btn-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
                </div>
            </div>
        </div>
    </div>

    <section class="mt-4" th:if="${!#lists.isEmpty(listaPedidos)}">
        <h2 class="h4 text-primary">Pedidos asociados</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle bg-white shadow-sm">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Cliente</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${listaPedidos}">
                        <td th:text="${pedido.id}">1</td>
                        <td th:text="${pedido.fecha ?: '-'}">2025-01-01</td>
                        <td th:text="${pedido.total ?: '-'}">0.00</td>
                        <td th:text="${pedido.clienteNombre ?: '-'}">Cliente</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
    <p class="alert alert-info mt-4" th:if="${#lists.isEmpty(listaPedidos)}">Este comercial no tiene pedidos asociados.</p>
</main>
</body>
</html>
