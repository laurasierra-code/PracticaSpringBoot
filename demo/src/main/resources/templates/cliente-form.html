<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h3 text-primary mb-4" th:text="${titulo}">Cliente</h1>
                    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="nombre">Nombre</label>
                                <input class="form-control" id="nombre" type="text" th:field="*{nombre}" required maxlength="100">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="apellido1">Primer apellido</label>
                                <input class="form-control" id="apellido1" type="text" th:field="*{apellido1}" required maxlength="100">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="apellido2">Segundo apellido</label>
                                <input class="form-control" id="apellido2" type="text" th:field="*{apellido2}" maxlength="100">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="ciudad">Ciudad</label>
                                <input class="form-control" id="ciudad" type="text" th:field="*{ciudad}" maxlength="100">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="categoria">Categoría</label>
                                <input class="form-control" id="categoria" type="number" min="0" th:field="*{categoria}">
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button class="btn btn-primary" type="submit">Guardar</button>
                            <a class="btn btn-outline-secondary" href="/clientes">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
