<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h1 class="h3 text-primary" th:text="${'Pedido #' + pedido.id}">Pedido</h1>
                    <dl class="row mt-4">
                        <dt class="col-sm-5">Total</dt><dd class="col-sm-7" th:text="${pedido.total}">0</dd>
                        <dt class="col-sm-5">Fecha</dt><dd class="col-sm-7" th:text="${pedido.fecha ?: '-'}">-</dd>
                        <dt class="col-sm-5">Cliente</dt><dd class="col-sm-7" th:text="${pedido.clienteNombre}">Cliente</dd>
                        <dt class="col-sm-5">Comercial</dt><dd class="col-sm-7" th:text="${pedido.comercialNombre}">Comercial</dd>
                    </dl>
                    <a class="btn btn-outline-secondary" href="/pedidos">Volver</a>
                    <a class="btn btn-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
