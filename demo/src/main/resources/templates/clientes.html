<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="text-primary mb-0">Clientes</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="/comerciales">Comerciales</a>
            <a class="btn btn-success" href="/clientes/crear">+ Crear cliente</a>
        </div>
    </div>

    <div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>

    <div class="row g-4">
        <div class="col-12 col-md-6 col-xl-4" th:each="cliente : ${listaClientes}">
            <article class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h2 class="h5 card-title" th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}">Nombre completo</h2>
                    <p class="card-text mb-1"><strong>Ciudad:</strong> <span th:text="${cliente.ciudad ?: '-'}">Ciudad</span></p>
                    <p class="card-text"><strong>Categoría:</strong> <span th:text="${cliente.categoria ?: '-'}">Categoría</span></p>
                </div>
                <div class="card-footer bg-white border-0 d-flex flex-wrap gap-2">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/clientes/{id}(id=${cliente.id})}">Ver detalle</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
                    <form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </div>
            </article>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(listaClientes)}">
            <div class="alert alert-info">No hay clientes registrados.</div>
        </div>
    </div>
</main>
</body>
</html>
