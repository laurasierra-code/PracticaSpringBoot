<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="text-primary mb-0">Clientes</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="/comerciales">Comerciales</a>
            <a class="btn btn-outline-primary" href="/pedidos">Pedidos</a>
            <a class="btn btn-success" href="/clientes/crear">+ Crear cliente</a>
        </div>
    </div>

    <div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>

    <form class="row g-2 align-items-end mb-4" th:action="@{/clientes}" method="get">
        <div class="col-sm-8 col-md-6">
            <label class="form-label" for="filtro">Filtrar por ciudad</label>
            <input class="form-control" id="filtro" name="filtro" type="text"
                   placeholder="Escribe una ciudad" th:value="${filtro}">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Buscar</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive" th:unless="${#lists.isEmpty(listaClientes)}">
        <table class="table table-striped table-hover align-middle bg-white shadow-sm">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Nombre completo</th>
                    <th>Ciudad</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${listaClientes}">
                    <td th:text="${cliente.id}">1</td>
                    <td th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}">Nombre completo</td>
                    <td th:text="${cliente.ciudad ?: '-'}">Ciudad</td>
                    <td th:text="${cliente.categoria ?: '-'}">Categoría</td>
                    <td>
                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/clientes/{id}(id=${cliente.id})}">Ver detalle</a>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
                            <form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="alert alert-info" th:if="${#lists.isEmpty(listaClientes)}">No hay clientes registrados.</div>
</main>
</body>
</html>
