<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="text-primary mb-0">Pedidos</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="/clientes">Clientes</a>
            <a class="btn btn-outline-primary" href="/comerciales">Comerciales</a>
            <a class="btn btn-success" href="/pedidos/crear">+ Crear pedido</a>
        </div>
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(listaPedidos)}">
        <table class="table table-striped table-hover align-middle bg-white shadow-sm">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Total</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Comercial</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${listaPedidos}">
                    <td th:text="${pedido.id}">1</td>
                    <td th:text="${pedido.total}">0</td>
                    <td th:text="${pedido.fecha ?: '-'}">-</td>
                    <td>
                        <a th:href="@{/clientes/{id}(id=${pedido.clienteId})}"
                           th:text="${pedido.clienteNombre}">
                            Cliente
                        </a>
                    </td>
                    <td>
                        <a th:href="@{/comerciales/{id}(id=${pedido.comercialId})}"
                           th:text="${pedido.comercialNombre}">
                            Comercial
                        </a>
                    </td>
                    <td>
                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver detalle</a>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
                            <form th:action="@{/pedidos/borrar/{id}(id=${pedido.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="alert alert-info" th:if="${#lists.isEmpty(listaPedidos)}">No hay pedidos registrados.</div>
</main>
</body>
</html>
