<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="text-primary mb-0">Pedidos</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="/clientes">Clientes</a>
            <a class="btn btn-outline-primary" href="/comerciales">Comerciales</a>
            <a class="btn btn-success" href="/pedidos/crear">+ Crear pedido</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-md-6 col-xl-4" th:each="pedido : ${listaPedidos}">
            <article class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h2 class="h5 card-title" th:text="${'Pedido #' + pedido.id}">Pedido</h2>
                    <p class="card-text mb-1"><strong>Total:</strong> <span th:text="${pedido.total}">0</span></p>
                    <p class="card-text mb-1"><strong>Fecha:</strong> <span th:text="${pedido.fecha ?: '-'}">-</span></p>
                    <p class="card-text mb-1"><strong>Cliente:</strong> <span th:text="${pedido.clienteNombre}">Cliente</span></p>
                    <p class="card-text"><strong>Comercial:</strong> <span th:text="${pedido.comercialNombre}">Comercial</span></p>
                </div>
                <div class="card-footer bg-white border-0 d-flex flex-wrap gap-2">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver detalle</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
                    <form th:action="@{/pedidos/borrar/{id}(id=${pedido.id})}" method="post">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </div>
            </article>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(listaPedidos)}">
            <div class="alert alert-info">No hay pedidos registrados.</div>
        </div>
    </div>
</main>
</body>
</html>
