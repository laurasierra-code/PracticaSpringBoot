<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comerciales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h1 class="text-primary mb-0">Comerciales</h1>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="/clientes">Clientes</a>
            <a class="btn btn-outline-primary" href="/pedidos">Pedidos</a>
            <a class="btn btn-success" href="/comerciales/crear">+ Crear comercial</a>
        </div>
    </div>

    <div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(listaComerciales)}">
        <table class="table table-striped table-hover align-middle bg-white shadow-sm">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Nombre completo</th>
                    <th>Comisión</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="comercial : ${listaComerciales}">
                    <td th:text="${comercial.id}">1</td>
                    <td th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}">Nombre completo</td>
                    <td th:text="${comercial.comision ?: '-'}">Comisión</td>
                    <td>
                        <div class="d-flex flex-wrap gap-2">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/comerciales/{id}(id=${comercial.id})}">Ver detalle</a>
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
                            <form th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="alert alert-info" th:if="${#lists.isEmpty(listaComerciales)}">No hay comerciales registrados.</div>
</main>
</body>
</html>
