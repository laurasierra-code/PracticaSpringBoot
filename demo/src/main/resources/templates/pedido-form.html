<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h3 text-primary mb-4" th:text="${titulo}">Pedido</h1>
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                    <form th:action="@{/pedidos/guardar}" th:object="${pedido}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="total">Total</label>
                                <input class="form-control" id="total" type="number" step="0.01" min="0" th:field="*{total}" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="fecha">Fecha</label>
                                <input class="form-control" id="fecha" type="date" th:field="*{fecha}">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="clienteId">Cliente</label>
                                <select class="form-select" id="clienteId" th:field="*{clienteId}" required>
                                    <option value="0">Selecciona un cliente</option>
                                    <option th:each="cliente : ${listaClientes}"
                                            th:value="${cliente.id}"
                                            th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}">
                                        Cliente
                                    </option>
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label" for="comercialId">Comercial</label>
                                <select class="form-select" id="comercialId" th:field="*{comercialId}" required>
                                    <option value="0">Selecciona un comercial</option>
                                    <option th:each="comercial : ${listaComerciales}"
                                            th:value="${comercial.id}"
                                            th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}">
                                        Comercial
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button class="btn btn-primary" type="submit">Guardar</button>
                            <a class="btn btn-outline-secondary" href="/pedidos">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
